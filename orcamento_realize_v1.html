<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simule seu orçamento · Buffet Realize</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#14224f;--navy2:#1d2f6b;--red:#c23a2b;--gold:#e0a82e;--bg:#f6f3ee;--card:#fff;--ink:#1c2240;--mut:#6b7191;--ok:#1f8f5f;--line:#e6e1d8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.45}
h1,h2,h3,.t{font-family:'Baloo 2','Nunito',system-ui,sans-serif;line-height:1.15}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
header b{font-family:'Baloo 2',system-ui,sans-serif;font-size:18px;letter-spacing:.3px}
header small{opacity:.7;font-size:12px;display:block;margin-top:-4px}
.back{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer;display:none}
.back.on{display:block}
.prog{height:4px;background:rgba(255,255,255,.18)}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s}
.hero{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;margin:0 -16px;padding:28px 20px 24px;text-align:center;position:relative;overflow:hidden}
.hero img.m{width:150px;display:block;margin:0 auto 6px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.hero h1{font-size:28px;margin:6px 0 10px}
.hero p{opacity:.92;font-size:16px;max-width:420px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 2px 10px rgba(20,34,79,.07);border:1px solid var(--line)}
.card h2{font-size:22px;color:var(--navy);margin-bottom:6px}
.card h3{font-size:18px;color:var(--navy)}
.sub{color:var(--mut);font-size:14px;margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font:800 17px 'Nunito',system-ui,sans-serif;cursor:pointer;background:var(--red);color:#fff;text-align:center;box-shadow:0 4px 0 #8f2a1f;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8f2a1f}
.btn.wa{background:#1faa59;box-shadow:0 4px 0 #14753c}
.btn.wa:active{box-shadow:0 2px 0 #14753c}
.btn.ghost{background:transparent;color:var(--navy);box-shadow:none;border:2px solid var(--line);margin-top:10px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--red);background:#fff6f3}
.opt b{display:block;font-size:17px;color:var(--navy)}
.opt span{font-size:13.5px;color:var(--mut)}
.opt em{font-style:normal;display:inline-block;background:var(--gold);color:#3a2a00;font-weight:800;font-size:11px;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:2px}
.note{background:#fff7e0;border:1px solid #f0dca0;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px;color:#5a4500}
.info{background:#eef2ff;border:1px solid #d5dcf7;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px;color:#26346b}
ul.l{list-style:none;margin-top:8px}
ul.l li{padding:3px 0 3px 22px;position:relative;font-size:15px}
ul.l li:before{content:'✓';position:absolute;left:0;color:var(--ok);font-weight:800}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -18px 4px;padding:0 18px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{height:130px;border-radius:12px;scroll-snap-align:start;flex:0 0 auto;object-fit:cover}
.cd h3{color:var(--red);font-size:24px}
.cd .grp{font-weight:800;color:var(--navy);font-size:13px;text-transform:uppercase;letter-spacing:.6px;margin-top:12px}
.price-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px}
.old{text-decoration:line-through;color:var(--mut);font-size:15px}
.big{font:800 28px 'Baloo 2',system-ui,sans-serif;color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{background:#eef2ff;color:var(--navy);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.row:last-child{border:0}
.row b{text-align:right}
.tot{background:var(--navy);color:#fff;border-radius:16px;padding:16px;margin-top:14px;text-align:center}
.tot .big{color:var(--gold);font-size:34px;display:block}
.tot small{opacity:.85}
.save{background:#e6f7ee;color:#14663f;border-radius:12px;padding:10px 12px;font-weight:800;text-align:center;margin-top:12px}
input.nm{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px;font:600 16px 'Nunito';margin-top:8px}
input.nm:focus{outline:0;border-color:var(--gold)}
.fadein{animation:f .35s ease}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stk{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:26px 16px calc(14px + env(safe-area-inset-bottom));z-index:15}
.stk .in{max-width:560px;margin:0 auto}
.close{font-size:19px;text-align:center;margin-top:6px}
</style>
</head>
<body>
<header>
  <button class="back" id="back" onclick="voltar()">← Voltar</button>
  <div style="flex:1"><b>Buffet Realize</b><small>Simulador de orçamento</small></div>
</header>
<div class="prog"><i id="prog"></i></div>
<div class="wrap" id="app"></div>
<div class="stk" id="stk" style="display:none"><div class="in" id="stkin"></div></div>

// ── preço de tabela ──
function precoBase(k, dia, pag){
  if (k==='diversao') return DIVERSAO.preco;
  if (pag===50) return P50[k];
  return P3040[pag][dia][k];
}
function horas(pag){ return pag===30 ? 3 : 4; }

// ── benefícios por forma de pagamento ──
function opcoes(k, pgto){
  const up = UP[k];
  const o = [];
  if (pgto==='avista'){
    o.push({id:'cort', desc:DESC.avista, cort:true, up:false});
    if (up) o.push({id:'up', desc:DESC.avista, cort:false, up:true});
  } else if (pgto==='pix'){
    o.push({id:'desc', desc:DESC.pix, cort:false, up:!!up});
    o.push({id:'cort', desc:0, cort:true, up:false});
  } else if (pgto==='cartao'){
    o.push({id:'desc', desc:DESC.cartao, cort:false, up:false});
    o.push({id:'cort', desc:0, cort:true, up:false});
  } else {
    o.push({id:'cort', desc:DESC.x10, cort:true, up:false});
    o.push({id:'bonus', desc:DESC.x10, cort:false, up:false, bonus:BONUS_X10});
  }
  return o;
}
function calcular(k, op){
  const base = precoBase(k, S.dia, S.pag);
  const descVal = r2(base*op.desc);
  let final = r2(base - descVal - (op.bonus||0));
  const porPag = base/S.pag;
  const cortVal = op.cort ? r2(porPag*CORTESIAS_QTD) : 0;
  let upVal = 0, upK = null;
  if (op.up && UP[k]){ upK = UP[k]; upVal = r2(precoBase(upK,S.dia,S.pag) - base); }
  const econ = r2(descVal + (op.bonus||0) + cortVal + upVal);
  return {base, final, descVal, bonus:op.bonus||0, cort:op.cort, cortVal, upK, upVal, econ, desc:op.desc};
}
function textoOpcao(k, op, c){
  const p=[];
  if (op.desc) p.push(`${Math.round(op.desc*100)}% de desconto`);
  if (op.cort) p.push(`${CORTESIAS_QTD} convidados cortesia`);
  if (op.bonus) p.push(`${R(op.bonus)} de desconto extra`);
  if (op.up) p.push(`upgrade para o ${NOME[UP[k]]}`);
  return p;
}
function regraIdade(){
  if (S.pag!==50) return 'Crianças até 4 anos não pagam. A partir de 5 anos (inclusive) todos pagam inteira.';
  if (S.pgto==='x10') return 'Crianças até 4 anos não pagam. Nesta forma de pagamento (10x), todos pagam inteira a partir de 5 anos.';
  return 'Crianças até 4 anos não pagam, de 5 a 9 anos pagam meia e a partir de 10 anos pagam inteira.';
}

   <li>Segurança, monitores, garçom, recepcionista, cozinheira, auxiliar de cozinha e um gestor sempre presente</li>
   <li>Bar com bistrô para os homens ficarem à vontade</li>
   <li>Localização privilegiada, na entrada da cidade e de fácil acesso</li></ul></div>
  <div class="card fadein"><h2 class="t">Para a família inteira se divertir</h2><p class="sub">Mais de 20 atrações para todas as faixas etárias</p>
   <div class="chips">${ATRACOES.map(a=>`<span>${a}</span>`).join('')}</div></div>`;
},
cardapios(){
  bar(`<button class="btn" onclick="go(3)">Já vi! Simular meu orçamento →</button>`);
  const ks = (DIVERSAO.preco?['diversao']:[]).concat(ORDEM);
  return `<div class="card fadein" style="background:transparent;box-shadow:none;border:0;padding:4px 0 0"><h2 class="t">Nossos cardápios</h2><p class="sub">Deslize as fotos e veja o que está incluso em cada um. Os valores aparecem logo depois das suas respostas.</p></div>` +
  ks.map(k=>`<div class="card cd fadein"><h3 class="t">${NOME[k]}</h3>
   ${k==='diversao'?`<div class="note">Condição especial: apenas de segunda a quinta, para 50 pagantes. Crianças a partir de 5 anos pagam inteira. ${DIVERSAO.cortesia}.</div><div class="grp">Itens</div><ul class="l">${DIVERSAO.itens.map(i=>`<li>${i}</li>`).join('')}</ul>`:slider(k)}</div>`).join('') +
  `<div class="card fadein"><h3>Incluso em todos os cardápios</h3><ul class="l">${INCLUSO.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
},
data(){
  bar('');
  return `<div class="card fadein"><h2 class="t">A data escolhida será:</h2><p class="sub">O valor muda conforme o dia da semana.</p>
   <button class="opt ${S.dia==='semana'?'sel':''}" onclick="set('dia','semana',1)"><b>De segunda a quinta-feira</b><span>Exceto feriados</span></button>
   <button class="opt ${S.dia==='fds'?'sel':''}" onclick="set('dia','fds',1)"><b>Sexta, sábado, domingo ou feriado</b></button></div>`;
},
pagantes(){
  bar('');
  const o=(n,t)=>`<button class="opt ${S.pag===n?'sel':''}" onclick="set('pag',${n},1)"><b>${n} pagantes</b><span>${t}</span></button>`;
  return `<div class="card fadein"><h2 class="t">Qual a quantidade aproximada de convidados?</h2><p class="sub">Escolha a quantidade de pagantes.</p>
  ${o(30,'Festa de 3 horas de duração')}${o(40,'Festa de 4 horas de duração')}${o(50,'Festa de 4 horas de duração')}
  <div class="note">Tem mais de 50 pagantes? Recomendamos fechar para 50 e fazer o adicional mais para frente. 😉</div></div>`;
},
pagamento(){
  bar('');
  return `<div class="card fadein"><h2 class="t">Como você deseja fazer o pagamento?</h2><p class="sub">Cada forma tem condições especiais.</p>`+
  Object.keys(PGTO).map(k=>`<button class="opt ${S.pgto===k?'sel':''}" onclick="set('pgto','${k}',1)"><b>${PGTO[k].t}${PGTO[k].tag?`<em>${PGTO[k].tag}</em>`:''}</b><span>${PGTO[k].s}</span></button>`).join('')+`</div>`;
},
escolha(){
  bar('');
  const ks = cardsDisponiveis();
  return `<div class="card fadein" style="background:transparent;box-shadow:none;border:0;padding:4px 0 0"><h2 class="t">Escolha o seu cardápio</h2><p class="sub">Valores para ${S.pag} pagantes, ${S.dia==='semana'?'de segunda a quinta':'sexta, sábado, domingo ou feriado'}.</p></div>`+
  ks.map(k=>{
    const b=precoBase(k,S.dia,S.pag);
    return `<button class="opt ${S.card===k?'sel':''}" onclick="set('card','${k}',1)"><b class="t" style="font-size:20px">${NOME[k]}</b>
    <div class="price-line"><span class="big">${R(b)}</span><span style="font-size:13px;color:var(--mut)">valor de tabela · ${R(b/S.pag)} por pagante</span></div>
    ${k==='diversao'?`<span>${DIVERSAO.cortesia}</span>`:''}</button>`;
  }).join('');
},
beneficio(){
  bar('');
  const k=S.card, ops=opcoes(k,S.pgto);
  const multi = ops.length>1;
  return `<div class="card fadein"><h2 class="t">${multi?'Escolha o seu benefício':'Sua condição'}</h2><p class="sub">${NOME[k]} · ${PGTO[S.pgto].t}</p>`+
  ops.map((op,i)=>{
    const c=calcular(k,op), t=textoOpcao(k,op,c);
    return `<button class="opt ${S.opId===op.id?'sel':''}" onclick="S.opId='${op.id}';go(${STEPS.indexOf('resumo')})">
     <b>${t.join(' + ')}</b>
     <div class="price-line">${c.final<c.base?`<span class="old">${R(c.base)}</span>`:''}<span class="big">${R(c.final)}</span></div>
     <span>${c.cort?`Você paga por ${S.pag} e traz ${S.pag+CORTESIAS_QTD} convidados pagantes. `:''}${c.upK?`Você paga o ${NOME[k]} e leva o ${NOME[c.upK]}. `:''}Economia de ${R(c.econ)}</span></button>`;
  }).join('')+
  (UP[k]?'':`<div class="note">O ${NOME[k]} já é o nosso cardápio mais completo, por isso não há opção de upgrade.</div>`)+`</div>`;
},
resumo(){
  const k=S.card, op=opcoes(k,S.pgto).find(o=>o.id===S.opId)||opcoes(k,S.pgto)[0];
  S.opId=op.id; const c=calcular(k,op);
  bar(`<button class="btn" onclick="go(${STEPS.indexOf('fechar')})">Quero fechar! 🎉</button>`);
  const rows=[
   ['Cardápio', c.upK?`${NOME[k]} → <u>${NOME[c.upK]}</u> (upgrade)`:NOME[k]],
   ['Data', S.dia==='semana'?'Segunda a quinta':'Sexta, sábado, domingo ou feriado'],
   ['Convidados pagantes', c.cort?`${S.pag} + ${CORTESIAS_QTD} cortesias = ${S.pag+CORTESIAS_QTD}`:`${S.pag}`],
   ['Duração da festa', horas(S.pag)+' horas'],
   ['Pagamento', PGTO[S.pgto].t]
  ];
  if (k==='diversao') rows.push(['Cortesia', DIVERSAO.cortesia]);
  const parc = S.pgto==='x10' ? `<small>ou 10x de ${R(c.final/10)} sem juros</small>` : '';
  return `<div class="card fadein"><h2 class="t">Seu orçamento</h2>
   ${rows.map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}
   <div class="row"><span>Valor de tabela</span><b>${R(c.base)}</b></div>
   ${c.desc?`<div class="row"><span>Desconto de ${Math.round(c.desc*100)}%</span><b style="color:var(--ok)">− ${R(c.descVal)}</b></div>`:''}
   ${c.bonus?`<div class="row"><span>Desconto extra (no lugar das cortesias)</span><b style="color:var(--ok)">− ${R(c.bonus)}</b></div>`:''}
   <div class="tot"><small>Valor total</small><span class="big">${R(c.final)}</span>${parc}</div>
   <div class="save">🎁 Você economiza ${R(c.econ)}</div>
   <div class="info"><b>Valores por idade:</b> ${regraIdade()}</div>
   <button class="btn ghost" onclick="go(${STEPS.indexOf('beneficio')})">Trocar o benefício</button>
   <button class="btn ghost" style="margin-top:8px" onclick="go(${STEPS.indexOf('escolha')})">Trocar o cardápio</button></div>
   <div class="card fadein"><h3>Incluso na sua festa</h3><ul class="l">${INCLUSO.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
},
fechar(){
  bar(`<button class="btn wa" onclick="enviarWA()">Falar com a Murieli no WhatsApp</button>`);
  return `<div class="hero fadein"><img class="m" src="${IMG.mascote}" alt="">
   <h1 class="t">Agora vamos partir para o fechamento! 🎉</h1>
   <p>Vou te encaminhar para a <b>Murieli</b>, que vai te enviar o <b>PDF</b> com todos os detalhes e cuidar do seu contrato.</p></div>
   <div class="card fadein"><h3>Como podemos te chamar?</h3><p class="sub">Opcional, para a Murieli já te receber pelo nome.</p>
   <input class="nm" id="nm" placeholder="Seu nome" value="${S.nome.replace(/"/g,'&quot;')}" oninput="S.nome=this.value" autocomplete="name"></div>`;
}
};

function enviarWA(){
  const k=S.card, op=opcoes(k,S.pgto).find(o=>o.id===S.opId), c=calcular(k,op);
  const nome=S.nome.trim();
  const L=[];
  L.push(`Olá, Murieli! ${nome?`Sou ${nome} e fiz`:'Fiz'} a simulação de orçamento no site do Buffet Realize e quero fechar. 🎉`,'');
  L.push(`*Cardápio:* ${c.upK?`${NOME[k]} com upgrade para o ${NOME[c.upK]}`:NOME[k]}`);
  L.push(`*Data:* ${S.dia==='semana'?'segunda a quinta':'sexta, sábado, domingo ou feriado'}`);
  L.push(`*Pagantes:* ${S.pag}${c.cort?` + ${CORTESIAS_QTD} cortesias`:''} (${horas(S.pag)}h de festa)`);
  L.push(`*Pagamento:* ${PGTO[S.pgto].t}`);
  L.push(`*Valor de tabela:* ${R(c.base)}`);
  if (c.desc) L.push(`*Desconto ${Math.round(c.desc*100)}%:* − ${R(c.descVal)}`);
  if (c.bonus) L.push(`*Desconto extra:* − ${R(c.bonus)}`);
  if (k==='diversao') L.push(`*Cortesia:* ${DIVERSAO.cortesia}`);
  L.push(`*Valor total:* ${R(c.final)}${S.pgto==='x10'?` (10x de ${R(c.final/10)})`:''}`);
  L.push('','Pode me enviar o PDF para seguirmos com o fechamento?');
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(L.join('\n'))}`,'_blank');
}

function render(){
  const name=STEPS[S.step];
  el('app').innerHTML=V[name]();
  el('back').className='back'+(S.step>0?' on':'');
  el('prog').style.width=((S.step)/(STEPS.length-1)*100)+'%';
}
render();
</script>
</body>
</html>
